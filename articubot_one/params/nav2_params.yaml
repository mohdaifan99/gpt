amcl:
  ros__parameters:
    use_sim_time: False
    min_particles: 500
    max_particles: 2000
    odom_topic: /odom
    scan_topic: /scan
    update_min_d: 0.2
    update_min_a: 0.2

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    expected_planner_frequency: 20.0

planner_server:
  ros__parameters:
    use_sim_time: False

bt_navigator:
  ros__parameters:
    use_sim_time: False

local_costmap:
  ros__parameters:
    update_frequency: 5.0
    publish_frequency: 2.0
    robot_base_frame: base_link
    width: 6.0
    height: 6.0
    resolution: 0.05
    plugins: ["obstacle_layer","inflation_layer"]
    obstacle_layer:
      observation_sources: laser_scan_sensor
      laser_scan_sensor: {sensor_frame: laser, data_type: LaserScan, topic: /scan, marking: true, clearing: true}
    inflation_layer: {}

global_costmap:
  ros__parameters:
    update_frequency: 1.0
    publish_frequency: 0.5
    robot_base_frame: base_link
    width: 40.0
    height: 40.0
    resolution: 0.05
    plugins: ["static_layer","obstacle_layer","inflation_layer"]
    static_layer: {}
    obstacle_layer:
      observation_sources: laser_scan_sensor
      laser_scan_sensor: {sensor_frame: laser, data_type: LaserScan, topic: /scan, marking: true, clearing: true}
    inflation_layer: {}

# Add footprint (example square) - adjust to your robot shape (meters)
robot:
  footprint: [[0.3,0.3],[0.3,-0.3],[-0.3,-0.3],[-0.3,0.3]]